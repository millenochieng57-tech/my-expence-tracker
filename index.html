<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY MANAGER</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
<div class="logo">MY MANAGER</div>
<span>OFFLINE DUKA OS</span>
</header>

<div class="container">
<div class="bal">
<small onclick="editBalance()">CURRENT BALANCE - TAP TO EDIT ✏️</small>
<h1 id="balance" onclick="editBalance()">KSh 0</h1>
<div class="row">
<span class="chip" id="chipToday">KSh 0 today</span>
<span class="chip" id="chipWeek">KSh 0 week</span>
<span class="chip" id="chipItems">0 items</span>
<span class="chip" id="chipReceipts">0 receipts</span>
</div>
<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">
<button onclick="exportBackup()" class="mini-btn" style="background:#00ff88">📥 EXPORT</button>
<button onclick="document.getElementById('importFile').click()" class="mini-btn" style="background:#ccff00">📤 IMPORT</button>
<button id="installBtn" onclick="installApp()" class="mini-btn" style="background:#fff">💻 INSTALL</button>
<button onclick="setPassword()" class="mini-btn dark">🔒 PASS</button>
<button onclick="openHelp()" class="mini-btn" style="background:#007bff;color:#fff">❓ HELP</button>
<input type="file" id="importFile" hidden accept=".json" onchange="importBackup(event)">
</div>
</div>

<div class="card">
<h3>➕ Add Sale</h3>
<input id="itemName" placeholder="Item name e.g Unga">
<input id="itemAmount" type="number" placeholder="Amount e.g 200">
<button class="btn" onclick="addSale()">ADD SALE</button>
</div>

<div class="card" id="salesList">
<h3>📜 Today's Sales</h3>
<p style="color:#666;margin-top:10px">No sales yet</p>
</div>

</div>

<script src="./script.js"></script>
<script>
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js')
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').innerText='⬇️ INSTALL APP'});
function installApp(){
 if(deferredPrompt){deferredPrompt.prompt()}else{alert('Tap 3 dots ⋮ → Add to Home screen → Install')}
}
</script>
</body>
</html>
