<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY MANAGER - Duka App</title>
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<meta name="theme-color" content="#ccff00">
</head>
<body>
<header>
<div class="logo">MY MANAGER</div>
<span>MY MANAGER • OFFLINE DUKA OS</span>
</header>

<div class="container">
<div class="bal" style="cursor:default">
<small onclick="editBalance()" style="cursor:pointer;display:block">CURRENT BALANCE - TAP TO EDIT ✏️</small>
<h1 id="balance" onclick="editBalance()" style="cursor:pointer">KSh 0</h1>
<div class="row">
<span class="chip" id="chipToday">KSh 0 today</span>
<span class="chip" id="chipWeek">KSh 0 week</span>
<span class="chip" id="chipItems">0 items</span>
<span class="chip" id="chipReceipts">0 receipts</span>
</div>
<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
<button onclick="event.stopPropagation(); exportBackup()" class="mini-btn" style="background:#00ff88">📥 EXPORT</button>
<button onclick="event.stopPropagation(); document.getElementById('importFile').click()" class="mini-btn" style="background:#ccff00">📤 IMPORT</button>
<button id="installBtn" onclick="event.stopPropagation(); installApp()" class="mini-btn" style="background:#fff">💻 INSTALL</button>
<button onclick="event.stopPropagation(); setPassword()" class="mini-btn dark">🔒 PASS</button>
<button onclick="event.stopPropagation(); openHelp()" class="mini-btn" style="background:#007bff;color:#fff">❓ HELP</button>
<input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
</div>
</div>

<!-- your other sections - stock, sales, etc stay same -->
<div id="appContent"></div>

</div>

<script src="./script.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display='inline-block';
  installBtn.innerText = '⬇️ INSTALL APP';
});
function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; });
  } else {
    alert('To install:\n1. Tap 3 dots ⋮ top right\n2. Tap Add to Home screen\n3. Tap Install');
  }
}
</script>
</body>
</html>
